<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
html,body{margin:0;background:#FFFFFF;}a{color:#1D5FD1;}a:hover{color:#0E1B33;}
.hero .block { transform-box: fill-box; transform-origin: center; }
.hero #block-1, .hero #block-2, .hero .fill { fill: rgba(29, 95, 209, 0.2); }
.hero .outline { fill: none; stroke: rgba(29, 95, 209, 0); stroke-width: 3; stroke-dasharray: 14 10.88; }
.hero line { stroke: rgba(29, 95, 209, 0.45); stroke-width: 4; stroke-dasharray: 108 108; stroke-dashoffset: 0; }
.hero #block-1 { animation: open-edge .6s cubic-bezier(.2, .8, .2, 1) 0s both, blue .3s 2.28s forwards, unblue .5s 3s forwards; }
.hero #block-2 { animation: open .6s .35s both, blue .3s 2.55s forwards, grow .7s cubic-bezier(.34, 1.3, .64, 1) 3.8s forwards; }
.hero #block-3 { animation: open .6s .7s both; }
.hero #block-4 { animation: open .6s 1.05s both; }
.hero #block-5 { animation: open-edge .6s cubic-bezier(.2, .8, .2, 1) 1.4s both; }
.hero #block-3 .fill { animation: blue .3s 2s forwards, unblue .5s 3s forwards, empty .6s 3.8s forwards; }
.hero #block-4 .fill { animation: blue .3s 2.42s forwards, unblue .5s 3s forwards, empty .6s 3.95s forwards; }
.hero #block-5 .fill { animation: blue .3s 2.12s forwards, unblue .5s 3s forwards, empty .6s 4.1s forwards; }
.hero #block-3 .outline { animation: outline .6s 3.8s forwards; }
.hero #block-4 .outline { animation: outline .6s 3.95s forwards; }
.hero #block-5 .outline { animation: outline .6s 4.1s forwards; }
.hero #link-1 { animation: draw .45s cubic-bezier(.4, 0, .2, 1) .2s both, link-blue .3s 2.35s forwards, link-fade .5s 3.8s forwards; }
.hero #link-2 { animation: draw .45s cubic-bezier(.4, 0, .2, 1) .55s both, link-blue .3s 2.05s forwards, link-dash .6s 3.9s forwards; }
.hero #link-3 { animation: draw .45s cubic-bezier(.4, 0, .2, 1) .9s both, link-blue .3s 2.5s forwards, link-dash .6s 4.05s forwards; }
.hero #link-4 { animation: draw .45s cubic-bezier(.4, 0, .2, 1) 1.25s both, link-blue .3s 2.2s forwards, link-dash .6s 4.2s forwards; }
@keyframes open { 0% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.2, .7, .3, 1); } 65% { opacity: 1; transform: scale(1.04); animation-timing-function: ease-in-out; } 100% { opacity: 1; transform: scale(1); } }
@keyframes open-edge { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
@keyframes grow { from { transform: scale(1); } to { transform: scale(1.2); } }
@keyframes blue { from { fill: rgba(29, 95, 209, 0.2); } to { fill: #1D5FD1; } }
@keyframes unblue { from { fill: #1D5FD1; } to { fill: rgba(29, 95, 209, 0.2); } }
@keyframes navy { from { fill: #1D5FD1; } to { fill: #0E1B33; } }
@keyframes empty { from { fill: rgba(29, 95, 209, 0.2); } to { fill: rgba(29, 95, 209, 0); } }
@keyframes outline { from { stroke: rgba(29, 95, 209, 0); } to { stroke: rgba(29, 95, 209, 0.45); } }
@keyframes draw { from { stroke-dashoffset: 108; } to { stroke-dashoffset: 0; } }
@keyframes link-blue { from { stroke: rgba(29, 95, 209, 0.45); } to { stroke: #1D5FD1; } }
@keyframes link-fade { from { stroke: #1D5FD1; } to { stroke: rgba(29, 95, 209, 0.45); } }
@keyframes link-dash { from { stroke: #1D5FD1; stroke-dasharray: 108 108; stroke-dashoffset: 0; } to { stroke: rgba(29, 95, 209, 0.45); stroke-dasharray: 10 8; stroke-dashoffset: -4; } }
@media (prefers-reduced-motion: reduce) {
  .hero * { animation: none !important; }
  .hero #block-2 { fill: #1D5FD1; transform: scale(1.2); }
  .hero .fill { fill: none; }
  .hero .outline { stroke: rgba(29, 95, 209, 0.45); }
  .hero #link-2, .hero #link-3, .hero #link-4 { stroke-dasharray: 10 8; stroke-dashoffset: -4; }
}
</style></helmet>
<div style="min-height:100vh;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;box-sizing:border-box;font-family:Helvetica, Arial, sans-serif;">
  <div style="width:100%;max-width:2000px;aspect-ratio:2000 / 930;">
    <sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
      <svg class="hero" viewBox="0 0 2000 930" width="100%" style="display:block;">
        <rect width="2000" height="930" fill="#FFFFFF"></rect>
        <line id="link-1" x1="424" y1="465" x2="532" y2="465"></line>
        <line id="link-2" x1="772" y1="465" x2="880" y2="465"></line>
        <line id="link-3" x1="1120" y1="465" x2="1228" y2="465"></line>
        <line id="link-4" x1="1468" y1="465" x2="1576" y2="465"></line>
        <rect id="block-1" class="block" x="184" y="345" width="240" height="240" rx="32"></rect>
        <rect id="block-2" class="block" x="532" y="345" width="240" height="240" rx="32"></rect>
        <g id="block-3" class="block">
          <rect class="fill" x="880" y="345" width="240" height="240" rx="32"></rect>
          <rect class="outline" x="881.5" y="346.5" width="237" height="237" rx="30.5"></rect>
        </g>
        <g id="block-4" class="block">
          <rect class="fill" x="1228" y="345" width="240" height="240" rx="32"></rect>
          <rect class="outline" x="1229.5" y="346.5" width="237" height="237" rx="30.5"></rect>
        </g>
        <g id="block-5" class="block">
          <rect class="fill" x="1576" y="345" width="240" height="240" rx="32"></rect>
          <rect class="outline" x="1577.5" y="346.5" width="237" height="237" rx="30.5"></rect>
        </g>
      </svg>
    </sc-if>
  </div>
  <button onClick="{{ replay }}" style="border:1px solid rgba(29,95,209,0.45);background:#FFFFFF;color:#0E1B33;font:500 13px Helvetica, Arial, sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer;" style-hover="background:rgba(29,95,209,0.08);">Replay</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { show: true };
  replay = () => {
    this.setState({ show: false }, () => requestAnimationFrame(() => this.setState({ show: true })));
  };
  renderVals() {
    return { show: this.state.show, replay: this.replay };
  }
}
</script>
</body>
</html>
